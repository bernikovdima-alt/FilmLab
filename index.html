<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1014">
<title>FilmLab</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e1014;--bg-2:#151922;--bg-3:#1c2230;
  --panel:#1a2029;--panel-2:#242b37;--line:#2f3644;
  --text:#eef1f6;--muted:#8b94a3;
  --accent:#4ea8ff;--good:#4ade80;--warn:#fbbf24;--danger:#f87171;
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --tool-h:42dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}

#stage{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#photoArea{
  flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;overflow:hidden;background:#000;
}
#canvasArea{
  position:relative;flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;
  padding:calc(8px + var(--safe-t)) 8px 8px;
}
.canvas-wrap{
  display:none;align-items:center;justify-content:center;
  width:100%;height:100%;position:relative;
}
.canvas-wrap.visible{display:flex}
.canvas-stack{position:relative;display:block;flex:0 0 auto}
.canvas-stack canvas.base{
  display:block;width:100%;height:100%;object-fit:contain;
  box-shadow:0 4px 20px rgba(0,0,0,.55);
}
.canvas-stack canvas.overlay{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
}

/* ======= НОВАЯ КНОПКА-ПЕРЕКЛЮЧАТЕЛЬ ======= */
#viewToggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  z-index:4;
  width:56px;height:56px;
  border-radius:50%;
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:0;
  transition:background .2s, transform .15s;
}
#viewToggle:active{transform:translateY(-50%) scale(.94)}
#viewToggle.active{
  background:var(--accent);
  color:#04121f;
  box-shadow:0 4px 14px rgba(78,168,255,.5),inset 0 0 0 2px rgba(0,0,0,.1);
}
#viewToggle svg{
  width:26px;height:26px;
  display:block;
  transition:transform .2s;
}
#viewToggle.active svg{transform:rotate(180deg)}

#emptyHint{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:20px;text-align:center;color:var(--muted);
}
#emptyHint .big{font-size:36px}
#emptyHint .txt{font-size:14px;line-height:1.4;max-width:240px}
#emptyHint label{
  display:inline-flex;align-items:center;gap:6px;
  padding:12px 18px;border-radius:12px;
  background:var(--accent);color:#04121f;
  font-weight:700;font-size:14px;cursor:pointer;border:0;
}
#emptyHint label.ghost{background:rgba(255,255,255,.12);color:#fff}

#loupe{
  position:absolute;width:112px;height:112px;border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.65);
  pointer-events:none;z-index:20;display:none;
  background:#000;overflow:hidden;
}
#loupe.show{display:block}
#loupe canvas{display:block;width:100%;height:100%}
#loupe .cross{position:absolute;inset:0;pointer-events:none}
#loupe .cross::before,
#loupe .cross::after{content:"";position:absolute;background:rgba(255,80,80,.9)}
#loupe .cross::before{left:50%;top:14%;bottom:14%;width:2px;transform:translateX(-50%)}
#loupe .cross::after{top:50%;left:14%;right:14%;height:2px;transform:translateY(-50%)}
#loupe .dot{
  position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
  background:#ff5050;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff;
}
#loupe .rgb{
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap;
}

#topHint{
  position:absolute;left:50%;top:calc(8px + var(--safe-t));
  transform:translateX(-50%);z-index:5;display:none;
  align-items:center;gap:8px;padding:6px 10px;
  border-radius:999px;background:rgba(0,0,0,.78);color:#fff;
  font-size:12px;font-weight:600;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;max-width:calc(100% - 24px);
}
#topHint.show{display:flex}
#topHint .dotc{width:8px;height:8px;border-radius:50%;background:var(--warn)}
#topHint button{
  border:0;background:var(--accent);color:#04121f;
  padding:4px 10px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;
}

#toolPanel{
  flex:0 0 var(--tool-h);background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;padding-top:6px;
}
#toolBody{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;
  padding:0 12px 8px;-webkit-overflow-scrolling:touch;
}

#bottomNav{
  flex:0 0 auto;
  display:flex;align-items:stretch;justify-content:space-around;
  padding:4px 4px calc(4px + var(--safe-b));
  background:rgba(15,18,24,.98);
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#bottomNav button{
  flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);
  padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-radius:10px;cursor:pointer;transition:color .15s;
}
#bottomNav button .ico{font-size:19px;line-height:1;filter:grayscale(1) brightness(.7)}
#bottomNav button .lbl{font-size:10px;font-weight:600;letter-spacing:.01em}
#bottomNav button.active{color:var(--accent)}
#bottomNav button.active .ico{filter:none}
#bottomNav button:active{background:rgba(255,255,255,.05)}

.group{background:var(--bg-2);border-radius:var(--radius);padding:2px 10px;margin:0 0 6px}

/* ======== КОМПАКТНЫЙ ПОЛЗУНОК ======== */
.slider{
  padding:2px 0 4px;
  user-select:none;
}
.slider .row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:1px;
  min-height:14px;
}
.slider .row label{
  flex:1 1 auto;min-width:0;
  font-size:12px;font-weight:600;color:#cfd6e2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.slider .row .val{
  font-size:12px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:34px;text-align:right;
}
.slider .ctrl{
  display:flex;align-items:center;gap:6px;
}
.slider .ctrl input[type=range]{
  flex:1 1 auto;min-width:0;
  display:block;width:100%;height:20px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;
}
/* По умолчанию трек */
.slider .ctrl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.slider .ctrl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.slider .ctrl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.slider .ctrl input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);
}
.slider .ctrl input[type=range]:disabled{
  opacity:.35;
  pointer-events:none;
}

/* Градиентные треки для цветовых каналов (R/G/B) */
.slider.sl-red .ctrl input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,#000,#ff0000);
}
.slider.sl-red .ctrl input[type=range]::-moz-range-track{
  background:linear-gradient(90deg,#000,#ff0000);
}
.slider.sl-green .ctrl input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,#000,#00ff00);
}
.slider.sl-green .ctrl input[type=range]::-moz-range-track{
  background:linear-gradient(90deg,#000,#00ff00);
}
.slider.sl-blue .ctrl input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,#000,#0066ff);
}
.slider.sl-blue .ctrl input[type=range]::-moz-range-track{
  background:linear-gradient(90deg,#000,#0066ff);
}
/* Градиент для температуры (холод → тепло) */
.slider.sl-temp .ctrl input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,#4ea8ff,#eef1f6 50%,#ffb547);
}
.slider.sl-temp .ctrl input[type=range]::-moz-range-track{
  background:linear-gradient(90deg,#4ea8ff,#eef1f6 50%,#ffb547);
}

/* Кнопки-квадратики с рамкой */
.icon-btn{
  flex:0 0 auto;
  width:28px;height:28px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--bg-3);
  color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;cursor:pointer;padding:0;
}
.icon-btn:active{background:var(--panel-2)}
.icon-btn.reset{color:#cfd6e2}
.icon-btn.reset:active{color:var(--accent);border-color:var(--accent)}
.icon-btn.lock{color:#cfd6e2}
.icon-btn.lock.locked{color:var(--warn);border-color:var(--warn)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  width:auto;flex:0 0 auto;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:#04121f}
.btn.danger{background:#3a1a1e;border-color:#5a2a2f;color:#ffb4b4}
.btn.active-mode{background:var(--warn);border-color:transparent;color:#1a1200}
.btn:disabled{opacity:.35;cursor:not-allowed}

.btn-row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.btn-row.tight{gap:4px}

.input,select.input{
  width:100%;height:38px;padding:0 10px;
  border-radius:10px;border:1px solid var(--line);
  background:var(--bg-3);color:var(--text);font-size:13px;
}
select.input{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:36px;
}
.file-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:38px;border-radius:10px;
  border:1px dashed var(--line);background:var(--bg-3);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;
  padding:0 12px;margin:0;flex:0 0 auto;
}

.status{
  font-size:12px;color:var(--muted);line-height:1.4;
  background:var(--bg-3);border-radius:10px;
  padding:8px 10px;margin:6px 0 0;overflow-wrap:anywhere;
}
.status.good{color:var(--good)}
.status:empty{display:none}

.segmented{display:flex;background:var(--bg-3);border-radius:12px;padding:3px;margin:0 0 6px}
.segmented button{
  flex:1 1 0;border:0;background:transparent;color:var(--muted);
  padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
}
.segmented button.active{background:var(--panel-2);color:var(--text)}

.ratio-grid{
  display:grid;grid-template-columns:repeat(5, minmax(0,1fr));
  grid-auto-rows:60px;gap:6px;margin:8px 0 4px;
}
.ratio-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px 2px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-3);color:var(--muted);cursor:pointer;min-width:0;
}
.ratio-cell:active{transform:scale(.96)}
.ratio-cell.active{border-color:var(--accent);color:var(--accent);background:rgba(78,168,255,.1)}
.ratio-cell.action{border-style:dashed}
.ratio-cell.primary{background:var(--accent);color:#04121f;border-color:transparent}
.ratio-cell.primary:active{background:#68b6ff}
.ratio-icon{display:block;border:2px solid currentColor;border-radius:3px;box-sizing:border-box}
.ratio-icon.free{border-style:dashed;position:relative}
.ratio-icon.free::after{content:"";position:absolute;inset:3px;border:1px dashed currentColor;border-radius:1px}
.ratio-lbl{font-size:10px;font-weight:600;line-height:1;white-space:nowrap}
.ratio-cell .action-lbl{font-size:11px;font-weight:700;line-height:1}
.ratio-cell .action-ico{font-size:16px;line-height:1}

@media (max-width:360px){
  .ratio-grid{grid-auto-rows:56px;gap:4px}
  .ratio-lbl{font-size:9px}
  .ratio-cell .action-lbl{font-size:10px}
}

.targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.target-col{
  background:var(--bg-3);border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:8px;min-width:0;
}
.target-title{font-size:12px;font-weight:700;color:var(--text);text-align:center;letter-spacing:.02em}
.target-swatch{
  width:100%;height:52px;border-radius:10px;
  border:2px solid var(--line);background:#333;
  position:relative;overflow:hidden;
}
.target-swatch::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%),
    linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%);
  background-size:12px 12px;
  background-position:0 0,6px 6px;
  pointer-events:none;
}
.target-label{font-size:11px;color:var(--muted);text-align:center;min-height:14px;overflow-wrap:anywhere}
.target-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.target-btns .btn{width:100%;height:36px;font-size:12px;padding:0 6px;justify-content:center}
.target-btns .btn.active-mode{background:var(--warn);border-color:transparent;color:#1a1200}

#gallery{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
#gallery::-webkit-scrollbar{display:none}
#gallery .thumb{
  flex:0 0 auto;width:60px;height:60px;border-radius:10px;overflow:hidden;
  border:2px solid transparent;background:#000;position:relative;cursor:pointer;scroll-snap-align:start;
}
#gallery .thumb img{width:100%;height:100%;object-fit:cover;display:block}
#gallery .thumb.selected{border-color:var(--accent)}
#gallery .thumb .del{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;border:0;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#galleryEmpty{font-size:12px;color:var(--muted);padding:6px 2px 2px}
.photo-name{font-size:12px;color:var(--muted);padding:0 2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toast{
  position:fixed;left:50%;top:calc(8px + var(--safe-t));
  transform:translateX(-50%) translateY(-16px);z-index:50;
  background:rgba(20,24,32,.97);border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;
  max-width:calc(100% - 32px);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.good{border-color:var(--good);color:var(--good)}
#toast.err{border-color:var(--danger);color:#ffc0c0}

#batchOverlay{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:#fff;font-size:14px;
}
#batchOverlay.show{display:flex}
#batchOverlay .spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-height:640px){
  #bottomNav button .lbl{display:none}
  #bottomNav button{padding:8px 2px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="photoArea">
    <div id="canvasArea">
      <div class="canvas-wrap visible" id="resultWrap">
        <div class="canvas-stack" id="resultStack" data-ratio="4x3">
          <canvas id="result" class="base"></canvas>
          <canvas id="resultOverlay" class="overlay"></canvas>
        </div>
      </div>
      <div class="canvas-wrap" id="sourceWrap">
        <div class="canvas-stack" id="sourceStack" data-ratio="4x3">
          <canvas id="source" class="base"></canvas>
          <canvas id="sourceOverlay" class="overlay"></canvas>
        </div>
      </div>

      <div id="emptyHint">
        <div class="big">🎞</div>
        <div class="txt">Добавь скан плёнки</div>
        <label for="fileInput">＋ Выбрать</label>
        <label class="ghost" for="cameraInput">📷 Снять</label>
      </div>

      <!-- Одна кнопка-переключатель -->
      <button id="viewToggle" type="button" class="active" aria-label="Результат/Скан">
        <svg id="viewIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- иконка "плёнка" (негатив) -->
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="7" cy="8" r="1.4"/>
          <circle cx="7" cy="16" r="1.4"/>
          <circle cx="17" cy="8" r="1.4"/>
          <circle cx="17" cy="16" r="1.4"/>
          <path d="M12 7v10M10 7h4M10 17h4"/>
        </svg>
      </button>

      <div id="loupe">
        <canvas id="loupeCanvas" width="220" height="220"></canvas>
        <div class="cross"></div>
        <div class="dot"></div>
        <div class="rgb" id="loupeRgb">RGB —</div>
      </div>

      <div id="topHint">
        <span class="dotc"></span>
        <span id="topHintText">Выбери точку</span>
        <button type="button" id="topHintDone">Готово</button>
      </div>
    </div>
  </div>

  <div id="toolPanel">
    <div id="toolBody"></div>
  </div>

  <div id="bottomNav">
    <button type="button" data-tool="crop" class="active"><span class="ico">✂️</span><span class="lbl">Кадр</span></button>
    <button type="button" data-tool="targets"><span class="ico">🎯</span><span class="lbl">Мишени</span></button>
    <button type="button" data-tool="light"><span class="ico">☀️</span><span class="lbl">Свет</span></button>
    <button type="button" data-tool="color"><span class="ico">🎨</span><span class="lbl">Цвет</span></button>
    <button type="button" data-tool="profiles"><span class="ico">👤</span><span class="lbl">Профили</span></button>
    <button type="button" data-tool="save"><span class="ico">💾</span><span class="lbl">Файлы</span></button>
  </div>
</div>

<div id="toast"></div>
<div id="batchOverlay">
  <div class="spinner"></div>
  <div id="batchText">Обработка…</div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple style="display:none">
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">

<div id="hiddenInputs" style="display:none">
  <input id="exposure" type="range" min="-100" max="100" value="0">
  <input id="contrast" type="range" min="-100" max="100" value="0">
  <input id="saturation" type="range" min="-100" max="100" value="0">
  <input id="temperature" type="range" min="-100" max="100" value="0">
  <input id="red" type="range" min="-100" max="100" value="0">
  <input id="green" type="range" min="-100" max="100" value="0">
  <input id="blue" type="range" min="-100" max="100" value="0">
  <input id="maskStrength" type="range" min="0" max="100" value="100">
  <select id="mode">
    <option value="negative">Цветной негатив</option>
    <option value="mono">Чёрно-белый негатив</option>
    <option value="slide">Позитив / слайд</option>
  </select>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const source=$("source"),result=$("result");
const sourceCtx=source.getContext("2d",{willReadFrequently:true});
const resultCtx=result.getContext("2d",{willReadFrequently:true});
const sourceOverlay=$("sourceOverlay"),resultOverlay=$("resultOverlay");
const sourceOverlayCtx=sourceOverlay.getContext("2d");
const resultOverlayCtx=resultOverlay.getContext("2d");

const defaults={maskStrength:100,temperature:0,exposure:0,contrast:0,saturation:0,red:0,green:0,blue:0};
const ALL_SLIDERS=["exposure","contrast","maskStrength","saturation","temperature","red","green","blue"];

let photos=[],selectedId=null,nextId=1;
let originalPixels=null,basePixels=null;
let cropEnabled=false,cropRect=null,cropDrag=null;
let currentRatio="free";
let maskColor=null,wbGains=null,maskPoint=null,wbPoint=null,pickerMode=null;
let renderQueued=false;
let activeTool="crop";
let currentView="result";
/* «Шаблон» — применённый профиль, для новых фото */
let appliedProfile=null;
const lockedSliders=new Set(ALL_SLIDERS);

const clamp=(v,a=0,b=255)=>Math.max(a,Math.min(b,v));

function toast(msg,type){
  const t=$("toast");
  t.textContent=msg;t.className="";
  if(type)t.classList.add(type);
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove("show"),2200);
}
function setStatus(id,msg,good){
  const el=$(id);if(!el)return;
  el.textContent=msg;el.classList.toggle("good",!!good);
}

function resizeAllStacks(){
  document.querySelectorAll(".canvas-stack").forEach(stack=>{
    const [w,h]=(stack.dataset.ratio||"4x3").split("x").map(Number);
    if(!w||!h)return;
    const parent=stack.parentElement;
    const availW=parent.clientWidth,availH=parent.clientHeight;
    if(!availW||!availH)return;
    const scale=Math.min(availW/w,availH/h);
    stack.style.width=Math.floor(w*scale)+"px";
    stack.style.height=Math.floor(h*scale)+"px";
  });
}
function setStackRatio(w,h){
  $("resultStack").dataset.ratio=w+"x"+h;
  $("sourceStack").dataset.ratio=w+"x"+h;
  resizeAllStacks();
}
window.addEventListener("resize",resizeAllStacks);
window.addEventListener("orientationchange",()=>setTimeout(resizeAllStacks,120));

/* ---------- ОДНА КНОПКА «Результат / Скан» ---------- */
const ICON_RESULT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4-4 4 4 3-3 7 7"/><circle cx="9" cy="9" r="1.5"/></svg>`;
const ICON_SOURCE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="7" cy="8" r="1.4"/><circle cx="7" cy="16" r="1.4"/><circle cx="17" cy="8" r="1.4"/><circle cx="17" cy="16" r="1.4"/><path d="M12 7v10M10 7h4M10 17h4"/></svg>`;

function setView(v){
  currentView=v;
  $("resultWrap").classList.toggle("visible",v==="result");
  $("sourceWrap").classList.toggle("visible",v==="source");
  const btn=$("viewToggle");
  btn.classList.toggle("active",v==="result");
  btn.innerHTML = v==="result" ? ICON_RESULT : ICON_SOURCE;
  setTimeout(resizeAllStacks,10);
}
$("viewToggle").addEventListener("click",()=>{
  setView(currentView==="result"?"source":"result");
});

/* ---------- Галерея ---------- */
function updateGallery(){
  const g=$("gallery");if(!g)return;
  g.replaceChildren();
  const empty=$("galleryEmpty");
  if(empty)empty.style.display=photos.length?"none":"block";
  photos.forEach(photo=>{
    const item=document.createElement("div");
    item.className="thumb"+(photo.id===selectedId?" selected":"");
    const img=document.createElement("img");
    img.alt=photo.name;img.src=photo.url;
    img.onerror=()=>{img.alt="!"};
    const del=document.createElement("button");
    del.className="del";del.type="button";del.textContent="×";
    del.addEventListener("click",e=>{e.stopPropagation();removePhoto(photo.id)});
    item.append(img,del);
    item.addEventListener("click",()=>selectPhoto(photo.id));
    g.append(item);
  });
  const nameEl=$("photoName");
  if(nameEl){
    const p=photos.find(p=>p.id===selectedId);
    nameEl.textContent=p?p.name:"";
  }
}

/* ======================================================
   НАСТРОЙКИ НА КАЖДОЕ ФОТО
   ====================================================== */
function snapshotCurrentSettings(){
  return {
    settings: getSliderValues(),
    mode: $("mode").value,
    maskColor: maskColor?[...maskColor]:null,
    wbGains: wbGains?[...wbGains]:null,
    maskPoint: maskPoint?{...maskPoint}:null,
    wbPoint: wbPoint?{...wbPoint}:null
  };
}
function applySettingsToUI(s){
  // Если настроек нет — используем текущие (для первого фото)
  const src = s || currentProfileSettingsTemplate();
  setSliderValues(src.settings);
  $("mode").value = src.mode || "negative";
  maskColor = src.maskColor?[...src.maskColor]:null;
  wbGains = src.wbGains?[...src.wbGains]:null;
  maskPoint = src.maskPoint?{...src.maskPoint}:null;
  wbPoint = src.wbPoint?{...src.wbPoint}:null;
  syncAllSlidersUI();
  refreshUIFromState();
}
function currentProfileSettingsTemplate(){
  // Шаблон для новых фото:
  // 1) если применён профиль — его настройки
  // 2) иначе дефолт
  if(appliedProfile) return {
    settings:{...defaults, ...(appliedProfile.settings||{})},
    mode: appliedProfile.mode||"negative",
    maskColor: appliedProfile.maskColor?[...appliedProfile.maskColor]:null,
    wbGains: appliedProfile.wbGains?[...appliedProfile.wbGains]:null,
    maskPoint:null, wbPoint:null
  };
  return {
    settings:{...defaults},
    mode:"negative",
    maskColor:null,wbGains:null,maskPoint:null,wbPoint:null
  };
}
function saveCurrentPhotoSettings(){
  if(selectedId===null)return;
  const photo=photos.find(p=>p.id===selectedId);
  if(!photo)return;
  photo.settings = snapshotCurrentSettings();
}

/* ---------- Загрузка/выбор фото ---------- */
function loadPhotoToCanvas(photo){
  if(!photo||!photo.url){toast("Нет файла","err");return}
  const img=new Image();
  img.onload=()=>{
    try{
      if(!img.naturalWidth||!img.naturalHeight)throw new Error("Размер 0");
      const maxDim=1800;
      const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*scale));
      const h=Math.max(1,Math.round(img.naturalHeight*scale));

      source.width=result.width=w;
      source.height=result.height=h;
      sourceOverlay.width=resultOverlay.width=w;
      sourceOverlay.height=resultOverlay.height=h;

      sourceCtx.clearRect(0,0,w,h);
      sourceCtx.drawImage(img,0,0,w,h);
      originalPixels=sourceCtx.getImageData(0,0,w,h);
      basePixels=new ImageData(new Uint8ClampedArray(originalPixels.data),w,h);

      cropRect=null;cropDrag=null;cropEnabled=false;
      currentRatio="free";
      stopPicking();

      // Восстанавливаем настройки ЭТОГО фото, если сохранены. Иначе — шаблон (профиль/дефолт)
      applySettingsToUI(photo.settings || null);

      drawMarkers();render();
      updateGallery();setStackRatio(w,h);
      $("emptyHint").style.display="none";
      toast("Загружено: "+photo.name,"good");
    }catch(err){
      originalPixels=null;toast("Ошибка: "+err.message,"err");
    }
  };
  img.onerror=()=>toast("Не удалось прочитать файл","err");
  img.src=photo.url;
}
function selectPhoto(id){
  // сохранить текущие настройки предыдущего фото
  if(selectedId!==null && selectedId!==id) saveCurrentPhotoSettings();
  selectedId=id;updateGallery();
  const photo=photos.find(p=>p.id===selectedId);
  if(photo)loadPhotoToCanvas(photo);
}

/* ---------- Добавление файлов ---------- */
function addFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  let added=0;const firstNewIndex=photos.length;const errs=[];
  for(const f of files){
    if(!f.type||!f.type.startsWith("image/")){errs.push(f.name);continue}
    if(f.size===0){errs.push(f.name);continue}
    try{
      photos.push({id:nextId++,name:f.name||"Фото",url:URL.createObjectURL(f),settings:null});
      added++;
    }catch(e){errs.push(f.name)}
  }
  updateGallery();
  if(added>0){
    if(selectedId===null||!photos.some(p=>p.id===selectedId)){
      selectedId=photos[firstNewIndex].id;
      updateGallery();
      loadPhotoToCanvas(photos[firstNewIndex]);
    }
    toast("Добавлено: "+added,errs.length?"":"good");
  }
  if(errs.length)toast("Не добавлено: "+errs.length,"err");
}
function connectFileInput(id){
  const input=$(id);
  input.addEventListener("change",e=>{
    try{addFiles(e.target.files)}catch(err){toast("Ошибка","err")}
    finally{input.value=""}
  });
}
connectFileInput("fileInput");
connectFileInput("cameraInput");

function removePhoto(id){
  const i=photos.findIndex(p=>p.id===id);
  if(i<0)return;
  URL.revokeObjectURL(photos[i].url);
  photos.splice(i,1);
  selectedId=photos.length?photos[Math.min(i,photos.length-1)].id:null;
  updateGallery();
  if(selectedId!==null)selectPhoto(selectedId);else resetStage();
}
function resetStage(){
  originalPixels=null;
  sourceCtx.clearRect(0,0,source.width,source.height);
  resultCtx.clearRect(0,0,result.width,result.height);
  sourceOverlayCtx.clearRect(0,0,sourceOverlay.width,sourceOverlay.height);
  resultOverlayCtx.clearRect(0,0,resultOverlay.width,resultOverlay.height);
  $("emptyHint").style.display="flex";
  stopPicking();
}

/* ---------- Слайдеры ---------- */
function getSliderValues(){const v={};Object.keys(defaults).forEach(k=>v[k]=Number($(k).value));return v}
function setSliderValues(v){
  Object.keys(defaults).forEach(k=>{
    if(v[k]!==undefined&&Number.isFinite(Number(v[k]))){
      $(k).value=Math.max(Number($(k).min),Math.min(Number($(k).max),Number(v[k])));
    }
  });
  updateSliderLabels();
}
function updateSliderLabels(){
  Object.keys(defaults).forEach(k=>{
    const out=$(k+"Val");
    if(out)out.textContent=$(k).value+(k==="maskStrength"?"%":"");
  });
}
function syncSliderUI(id){
  const hidden=$(id);
  const ui=document.getElementById(id+"_ui");
  if(ui&&hidden)ui.value=hidden.value;
  const v=document.getElementById(id+"Val");
  if(v&&hidden)v.textContent=hidden.value+(id==="maskStrength"?"%":"");
}
function syncAllSlidersUI(){
  ALL_SLIDERS.forEach(syncSliderUI);
}
function scheduleRender(){
  updateSliderLabels();
  if(renderQueued)return;
  renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;render()});
}
Object.keys(defaults).forEach(k=>$(k).addEventListener("input",scheduleRender));

/* ---------- Трансформация ---------- */
function transformPixel(r,g,b,opts){
  const mode=opts.mode;
  if(mode==="negative"||mode==="mono"){
    if(opts.mask){
      const strength=opts.maskStrength/100;
      const m=opts.mask;
      const base=[Math.max(8,m[0]),Math.max(8,m[1]),Math.max(8,m[2])];
      const cr=clamp(r*255/base[0]),cg=clamp(g*255/base[1]),cb=clamp(b*255/base[2]);
      r=r*(1-strength)+cr*strength;
      g=g*(1-strength)+cg*strength;
      b=b*(1-strength)+cb*strength;
    }
    r=255-r;g=255-g;b=255-b;
  }
  if(mode==="mono"){const y=0.2126*r+0.7152*g+0.0722*b;r=g=b=y}
  const t=Number(opts.temperature||0)/100;
  r=clamp(r*Math.pow(2,t*0.45));
  g=clamp(g*Math.pow(2,t*0.08));
  b=clamp(b*Math.pow(2,-t*0.55));
  const exp=Math.pow(2,opts.exposure/100);
  const gains=[opts.red,opts.green,opts.blue].map(v=>Math.pow(2,v/100));
  r=clamp(r*exp*gains[0]);g=clamp(g*exp*gains[1]);b=clamp(b*exp*gains[2]);
  const con=(259*(opts.contrast+255))/(255*(259-opts.contrast));
  r=clamp(con*(r-128)+128);g=clamp(con*(g-128)+128);b=clamp(con*(b-128)+128);
  const sat=1+opts.saturation/100;
  const lum=0.2126*r+0.7152*g+0.0722*b;
  r=clamp(lum+(r-lum)*sat);g=clamp(lum+(g-lum)*sat);b=clamp(lum+(b-lum)*sat);
  if(opts.wb){
    r=clamp(r*opts.wb[0]);g=clamp(g*opts.wb[1]);b=clamp(b*opts.wb[2]);
  }
  return [r,g,b];
}
function currentTransformOptions(){
  const v=getSliderValues();
  return {...v,mode:$("mode").value,mask:maskColor?[...maskColor]:null,wb:wbGains?[...wbGains]:null};
}
function render(){
  if(!originalPixels)return;
  const w=originalPixels.width,h=originalPixels.height,src=originalPixels.data;
  const out=new ImageData(new Uint8ClampedArray(src),w,h),d=out.data;
  const opts=currentTransformOptions();
  for(let i=0;i<d.length;i+=4){
    const p=transformPixel(src[i],src[i+1],src[i+2],opts);
    d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=src[i+3];
  }
  resultCtx.putImageData(out,0,0);
  if(cropEnabled&&cropRect)drawCropRect();else drawMarkers();
}

function drawCross(ctx,point,color){
  if(!point)return;
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,Math.min(source.width,source.height)/300);
  const r=Math.max(8,Math.min(source.width,source.height)/45);
  ctx.beginPath();ctx.arc(point.x,point.y,r,0,Math.PI*2);
  ctx.moveTo(point.x-r*1.5,point.y);ctx.lineTo(point.x+r*1.5,point.y);
  ctx.moveTo(point.x,point.y-r*1.5);ctx.lineTo(point.x,point.y+r*1.5);
  ctx.stroke();ctx.restore();
}
function drawMarkers(){
  sourceOverlayCtx.clearRect(0,0,sourceOverlay.width,sourceOverlay.height);
  resultOverlayCtx.clearRect(0,0,resultOverlay.width,resultOverlay.height);
  drawCross(sourceOverlayCtx,maskPoint,"#fbbf24");
  drawCross(resultOverlayCtx,wbPoint,"#4ade80");
}

function getCanvasPoint(event,canvas){
  const rect=canvas.getBoundingClientRect();
  return{
    x:Math.max(0,Math.min(canvas.width-1,Math.floor((event.clientX-rect.left)*canvas.width/rect.width))),
    y:Math.max(0,Math.min(canvas.height-1,Math.floor((event.clientY-rect.top)*canvas.height/rect.height)))
  };
}
function samplePixel(canvas,point){
  const ctx=canvas===result?resultCtx:sourceCtx;
  const image=ctx.getImageData(0,0,canvas.width,canvas.height);
  const w=image.width,h=image.height,data=image.data;
  const radius=3,channels=[[],[],[]];
  for(let y=Math.max(0,point.y-radius);y<=Math.min(h-1,point.y+radius);y++){
    for(let x=Math.max(0,point.x-radius);x<=Math.min(w-1,point.x+radius);x++){
      const i=(y*w+x)*4;
      if(data[i+3]<16)continue;
      channels[0].push(data[i]);channels[1].push(data[i+1]);channels[2].push(data[i+2]);
    }
  }
  if(!channels[0].length)return [0,0,0];
  return channels.map(a=>{a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]});
}

const loupe=$("loupe"),loupeCanvas=$("loupeCanvas");
const loupeCtx=loupeCanvas.getContext("2d"),loupeRgb=$("loupeRgb");
const loupeZoom=6;

function positionLoupe(px,py,areaRect){
  const size=112,margin=8;
  let x=px-size/2;
  let y=py-size-60;
  if(y<margin)y=py+60;
  x=Math.max(margin,Math.min(areaRect.width-size-margin,x));
  y=Math.max(margin,Math.min(areaRect.height-size-margin,y));
  loupe.style.left=x+"px";loupe.style.top=y+"px";
}
function drawLoupe(srcCanvas,srcX,srcY){
  const size=loupeCanvas.width,half=size/(2*loupeZoom);
  loupeCtx.clearRect(0,0,size,size);
  loupeCtx.fillStyle="#000";loupeCtx.fillRect(0,0,size,size);
  loupeCtx.imageSmoothingEnabled=false;
  loupeCtx.drawImage(srcCanvas,srcX-half,srcY-half,half*2,half*2,0,0,size,size);
}
function showLoupe(srcCanvas,srcPoint,clientX,clientY){
  drawLoupe(srcCanvas,srcPoint.x,srcPoint.y);
  const ctx=srcCanvas===result?resultCtx:sourceCtx;
  try{
    const px=ctx.getImageData(srcPoint.x,srcPoint.y,1,1).data;
    loupeRgb.textContent="RGB("+px[0]+","+px[1]+","+px[2]+")";
  }catch(e){loupeRgb.textContent="RGB —"}
  const areaRect=$("canvasArea").getBoundingClientRect();
  positionLoupe(clientX-areaRect.left,clientY-areaRect.top,areaRect);
  loupe.classList.add("show");
}
function hideLoupe(){loupe.classList.remove("show")}

const topHint=$("topHint"),topHintText=$("topHintText");
let pickDrag=null;

function updatePickUI(){
  const maskOn=pickerMode==="mask";
  const wbOn=pickerMode==="wb";
  const maskBtn=$("pickMaskBtn"),wbBtn=$("pickWbBtn");
  if(maskBtn)maskBtn.classList.toggle("active-mode",maskOn);
  if(wbBtn)wbBtn.classList.toggle("active-mode",wbOn);
  topHint.classList.toggle("show",!!pickerMode);
  if(maskOn){topHintText.textContent="Тапни по основе";setView("source")}
  if(wbOn){topHintText.textContent="Тапни по нейтральному";setView("result")}
}
function stopPicking(){pickerMode=null;hideLoupe();pickDrag=null;updatePickUI()}

function attachPickerHandlers(canvas,type){
  canvas.style.touchAction="none";
  canvas.addEventListener("pointerdown",e=>{
    if(pickerMode!==type||!originalPixels)return;
    e.preventDefault();
    const p=getCanvasPoint(e,canvas);
    pickDrag={canvas,type};
    showLoupe(canvas,p,e.clientX,e.clientY);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!pickDrag||pickDrag.canvas!==canvas||pickerMode!==type)return;
    e.preventDefault();
    const p=getCanvasPoint(e,canvas);
    showLoupe(canvas,p,e.clientX,e.clientY);
  });
  canvas.addEventListener("pointerup",e=>{
    if(!pickDrag||pickDrag.canvas!==canvas)return;
    e.preventDefault();
    const p=getCanvasPoint(e,canvas);
    hideLoupe();pickDrag=null;
    if(type==="mask"){
      maskPoint=p;maskColor=samplePixel(source,p);
      setStatus("maskInfo","RGB("+maskColor.join(", ")+")","good");
      const sw=$("maskSwatch");if(sw)sw.style.background="rgb("+maskColor.join(",")+")";
      const lb=$("maskLabel");if(lb)lb.textContent="RGB("+maskColor.join(", ")+")";
      drawMarkers();render();
    }else{
      wbPoint=p;
      const s=samplePixel(result,p);
      const avg=(s[0]+s[1]+s[2])/3;
      wbGains=[s[0],s[1],s[2]].map(v=>Math.max(.25,Math.min(4,avg/Math.max(1,v))));
      setStatus("wbInfo","RGB("+s.join(", ")+")","good");
      const sw=$("wbSwatch");if(sw)sw.style.background="rgb("+s.join(",")+")";
      const lb=$("wbLabel");if(lb)lb.textContent="RGB("+s.join(", ")+")";
      drawMarkers();render();
    }
  });
  canvas.addEventListener("pointercancel",()=>{hideLoupe();pickDrag=null});
}
attachPickerHandlers(source,"mask");
attachPickerHandlers(result,"wb");

$("topHintDone").addEventListener("click",stopPicking);

source.addEventListener("click",e=>{
  if(pickerMode!=="mask"||!originalPixels)return;
  if(pickDrag)return;
  const p=getCanvasPoint(e,source);
  maskPoint=p;maskColor=samplePixel(source,p);
  setStatus("maskInfo","RGB("+maskColor.join(", ")+")","good");
  const sw=$("maskSwatch");if(sw)sw.style.background="rgb("+maskColor.join(",")+")";
  const lb=$("maskLabel");if(lb)lb.textContent="RGB("+maskColor.join(", ")+")";
  drawMarkers();render();
});
result.addEventListener("click",e=>{
  if(pickerMode!=="wb"||!originalPixels)return;
  if(pickDrag)return;
  const p=getCanvasPoint(e,result);
  wbPoint=p;
  const s=samplePixel(result,p);
  const avg=(s[0]+s[1]+s[2])/3;
  wbGains=[s[0],s[1],s[2]].map(v=>Math.max(.25,Math.min(4,avg/Math.max(1,v))));
  setStatus("wbInfo","RGB("+s.join(", ")+")","good");
  const sw=$("wbSwatch");if(sw)sw.style.background="rgb("+s.join(",")+")";
  const lb=$("wbLabel");if(lb)lb.textContent="RGB("+s.join(", ")+")";
  drawMarkers();render();
});

/* ---------- Профили ---------- */
function currentProfile(){
  return{
    format:"FilmLabProfile",version:1,
    settings:getSliderValues(),mode:$("mode").value,
    maskColor:maskColor?[...maskColor]:null,wbGains:wbGains?[...wbGains]:null
  };
}
function getProfiles(){
  try{const d=JSON.parse(localStorage.getItem("filmlab_profiles")||"{}");return d&&typeof d==="object"&&!Array.isArray(d)?d:{}}
  catch(e){return{}}
}
function writeProfiles(p){
  try{localStorage.setItem("filmlab_profiles",JSON.stringify(p));return true}
  catch(e){alert("Не удалось сохранить профили");return false}
}
function refreshProfiles(sel=""){
  const ps=getProfiles(),s=$("profiles");
  if(!s)return;
  s.replaceChildren(new Option("— Выбери профиль —",""));
  Object.keys(ps).sort((a,b)=>a.localeCompare(b,"ru")).forEach(n=>s.add(new Option(n,n)));
  if(sel&&ps[sel])s.value=sel;
}
function downloadJSON(data,filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function safeProfileFilename(name){return name.replace(/[<>:"/\\|?*\x00-\x1F]/g,"_")||"FilmLab"}
function validProfile(p){
  if(!p||typeof p!=="object"||Array.isArray(p)||!p.settings||typeof p.settings!=="object")return false;
  if(p.mode!==undefined&&!["negative","mono","slide"].includes(p.mode))return false;
  for(const k of Object.keys(defaults))if(!Number.isFinite(Number(p.settings[k])))return false;
  return true;
}

/* ---------- Поворот/кроп ---------- */
function showWorkingPixels(pixels){
  originalPixels=new ImageData(new Uint8ClampedArray(pixels.data),pixels.width,pixels.height);
  source.width=result.width=pixels.width;
  source.height=result.height=pixels.height;
  sourceOverlay.width=resultOverlay.width=pixels.width;
  sourceOverlay.height=resultOverlay.height=pixels.height;
  sourceCtx.putImageData(originalPixels,0,0);
  cropRect=null;cropDrag=null;cropEnabled=false;
  setStackRatio(pixels.width,pixels.height);
  drawMarkers();render();
}
function rotateImage(dir){
  if(!originalPixels){toast("Нет фото","err");return}
  const w=originalPixels.width,h=originalPixels.height;
  const temp=document.createElement("canvas");
  temp.width=h;temp.height=w;
  const ctx=temp.getContext("2d",{willReadFrequently:true});
  const src=document.createElement("canvas");
  src.width=w;src.height=h;
  src.getContext("2d").putImageData(originalPixels,0,0);
  ctx.translate(temp.width/2,temp.height/2);
  ctx.rotate(dir*Math.PI/2);
  ctx.drawImage(src,-w/2,-h/2);
  showWorkingPixels(ctx.getImageData(0,0,temp.width,temp.height));
  if(currentRatio!=="free")applyAspectRatio(currentRatio);
  toast("Повёрнуто","good");
}

function drawCropRect(){
  drawMarkers();
  if(!cropEnabled||!cropRect)return;
  const ctx=sourceOverlayCtx,r=cropRect,w=source.width,h=source.height;
  const handle=Math.max(22,Math.min(w,h)*0.03);
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.fillRect(0,0,w,r.y);
  ctx.fillRect(0,r.y+r.h,w,h-r.y-r.h);
  ctx.fillRect(0,r.y,r.x,r.h);
  ctx.fillRect(r.x+r.w,r.y,w-r.x-r.w,r.h);
  ctx.strokeStyle="#4ade80";
  ctx.lineWidth=Math.max(2,Math.min(w,h)/400);
  ctx.strokeRect(r.x,r.y,r.w,r.h);
  [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].forEach(([x,y])=>{
    ctx.fillStyle="#fff";
    ctx.fillRect(x-handle/2,y-handle/2,handle,handle);
    ctx.strokeStyle="#16885b";
    ctx.lineWidth=Math.max(2,handle/8);
    ctx.strokeRect(x-handle/2,y-handle/2,handle,handle);
  });
  ctx.restore();
}

function computeAspectRect(ratio, currentRect){
  if(!originalPixels)return currentRect;
  if(ratio==="free"||!ratio)return currentRect;
  const [rw,rh]=ratio.split(":").map(Number);
  if(!rw||!rh)return currentRect;
  const targetRatio=rw/rh;
  const imgW=originalPixels.width,imgH=originalPixels.height;
  let testW=Math.min(imgW,imgH*targetRatio);
  let testH=testW/targetRatio;
  let cx,cy;
  if(currentRect){cx=currentRect.x+currentRect.w/2;cy=currentRect.y+currentRect.h/2}
  else{cx=imgW/2;cy=imgH/2}
  let testX=cx-testW/2,testY=cy-testH/2;
  testX=Math.max(0,Math.min(imgW-testW,testX));
  testY=Math.max(0,Math.min(imgH-testH,testY));
  return {x:testX,y:testY,w:testW,h:testH};
}

function applyAspectRatio(ratio){
  currentRatio=ratio;
  document.querySelectorAll(".ratio-cell").forEach(b=>{
    const r=b.dataset.ratio;
    if(!r||r==="apply"||r==="reset")return;
    b.classList.toggle("active",r===ratio);
  });
  if(!originalPixels)return;
  if(ratio==="free"){if(cropEnabled&&cropRect)drawCropRect();return}
  if(!cropEnabled){
    cropEnabled=true;
    if(!cropRect){
      const w=originalPixels.width,h=originalPixels.height;
      const mx=Math.round(w*0.08),my=Math.round(h*0.08);
      cropRect={x:mx,y:my,w:w-mx*2,h:h-my*2};
    }
    setView("source");
  }
  cropRect=computeAspectRect(ratio,cropRect);
  drawCropRect();
}

function getPinchDistance(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.hypot(dx,dy);
}
function getPinchCenter(touches,canvas){
  const rect=canvas.getBoundingClientRect();
  const cx=(touches[0].clientX+touches[1].clientX)/2;
  const cy=(touches[0].clientY+touches[1].clientY)/2;
  return {
    x:(cx-rect.left)*canvas.width/rect.width,
    y:(cy-rect.top)*canvas.height/rect.height
  };
}

let pinchState=null;
source.addEventListener("touchstart",e=>{
  if(!cropEnabled||!originalPixels||pickerMode)return;
  if(e.touches.length!==2)return;
  e.preventDefault();
  pinchState={
    startDist:getPinchDistance(e.touches),
    startRect:{...cropRect},
    startCenter:getPinchCenter(e.touches,source)
  };
},{passive:false});
source.addEventListener("touchmove",e=>{
  if(!cropEnabled||!originalPixels||!pinchState)return;
  if(e.touches.length!==2)return;
  e.preventDefault();
  const dist=getPinchDistance(e.touches);
  const scale=dist/pinchState.startDist;
  const imgW=source.width,imgH=source.height;
  const startRect=pinchState.startRect;
  let newW=startRect.w*scale,newH=startRect.h*scale;
  const minSize=20;
  if(newW<minSize)newW=minSize;
  if(newH<minSize)newH=minSize;
  if(newW>imgW)newW=imgW;
  if(newH>imgH)newH=imgH;
  if(currentRatio!=="free"){
    const [rw,rh]=currentRatio.split(":").map(Number);
    const targetRatio=rw/rh;
    if(newW/newH>targetRatio)newH=newW/targetRatio;
    else newW=newH*targetRatio;
    if(newW>imgW){newW=imgW;newH=newW/targetRatio}
    if(newH>imgH){newH=imgH;newW=newH*targetRatio}
  }
  const center=pinchState.startCenter;
  let newX=center.x-newW/2,newY=center.y-newH/2;
  newX=Math.max(0,Math.min(imgW-newW,newX));
  newY=Math.max(0,Math.min(imgH-newH,newY));
  cropRect={x:newX,y:newY,w:newW,h:newH};
  drawCropRect();
},{passive:false});
source.addEventListener("touchend",()=>{if(pinchState)pinchState=null},{passive:true});
source.addEventListener("touchcancel",()=>{pinchState=null},{passive:true});

source.style.touchAction="none";
source.addEventListener("pointerdown",event=>{
  if(!cropEnabled||!originalPixels||pickerMode)return;
  if(event.pointerType==="touch"&&event.isPrimary===false)return;
  const p=getCanvasPoint(event,source),r=cropRect;
  if(!r)return;
  const hitRadius=48;
  const corners=[
    {name:"tl",x:r.x,y:r.y},{name:"tr",x:r.x+r.w,y:r.y},
    {name:"bl",x:r.x,y:r.y+r.h},{name:"br",x:r.x+r.w,y:r.y+r.h}
  ];
  let nearest=null,best=Infinity;
  corners.forEach(c=>{
    const dx=(p.x-c.x)*source.getBoundingClientRect().width/source.width;
    const dy=(p.y-c.y)*source.getBoundingClientRect().height/source.height;
    const d=Math.hypot(dx,dy);
    if(d<best){best=d;nearest=c}
  });
  if(nearest&&best<=hitRadius){
    cropDrag={type:"corner",corner:nearest.name,startX:p.x,startY:p.y,rect:{...r}};
  }else if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){
    cropDrag={type:"move",startX:p.x,startY:p.y,rect:{...r}};
  }else return;
  event.preventDefault();
  source.setPointerCapture(event.pointerId);
});
source.addEventListener("pointermove",event=>{
  if(!cropEnabled||!cropDrag||!originalPixels)return;
  event.preventDefault();
  const p=getCanvasPoint(event,source);
  const d=cropDrag,r=d.rect,minSize=20;
  if(d.type==="move"){
    cropRect={
      x:Math.max(0,Math.min(source.width-r.w,r.x+p.x-d.startX)),
      y:Math.max(0,Math.min(source.height-r.h,r.y+p.y-d.startY)),
      w:r.w,h:r.h
    };
  }else if(currentRatio==="free"){
    let l=r.x,rt=r.x+r.w,t=r.y,b=r.y+r.h;
    if(d.corner.includes("l"))l=Math.max(0,Math.min(rt-minSize,p.x));
    if(d.corner.includes("r"))rt=Math.min(source.width,Math.max(l+minSize,p.x));
    if(d.corner.includes("t"))t=Math.max(0,Math.min(b-minSize,p.y));
    if(d.corner.includes("b"))b=Math.min(source.height,Math.max(t+minSize,p.y));
    cropRect={x:l,y:t,w:rt-l,h:b-t};
  }else{
    const [rw,rh]=currentRatio.split(":").map(Number);
    const targetRatio=rw/rh;
    const fixedX=d.corner.includes("l")?r.x+r.w:r.x;
    const fixedY=d.corner.includes("t")?r.y+r.h:r.y;
    const maxW=d.corner.includes("l")?fixedX:(source.width-fixedX);
    const maxH=d.corner.includes("t")?fixedY:(source.height-fixedY);
    let w=Math.min(Math.abs(p.x-fixedX),maxW);
    let h=Math.min(Math.abs(p.y-fixedY),maxH);
    if(w/h>targetRatio)h=w/targetRatio;else w=h*targetRatio;
    if(w>maxW){w=maxW;h=w/targetRatio}
    if(h>maxH){h=maxH;w=h*targetRatio}
    if(w<minSize){w=minSize;h=w/targetRatio}
    if(h<minSize){h=minSize;w=h*targetRatio}
    let newX,newY;
    if(d.corner.includes("l"))newX=fixedX-w;else newX=fixedX;
    if(d.corner.includes("t"))newY=fixedY-h;else newY=fixedY;
    cropRect={x:newX,y:newY,w,h};
  }
  drawCropRect();
});
source.addEventListener("pointerup",()=>{cropDrag=null});
source.addEventListener("pointercancel",()=>{cropDrag=null});

function downloadCanvas(canvas,filename){
  canvas.toBlob(blob=>{
    if(!blob){toast("Не удалось создать JPEG","err");return}
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },"image/jpeg",.95);
}
function safeFilename(name){return name.replace(/\.[^.]+$/,"").replace(/[<>:"/\\|?*\x00-\x1F]/g,"_")||"FilmLab"}
function saveCurrentJpeg(){
  if(!originalPixels){toast("Нет фото","err");return}
  downloadCanvas(result,safeFilename(photos.find(p=>p.id===selectedId)?.name||"FilmLab")+"_positive.jpg");
  toast("JPEG сохраняется","good");
}

function refreshUIFromState(){
  updateSliderLabels();
  const seg=$("modeSeg");
  if(seg)seg.querySelectorAll("[data-mode]").forEach(b=>{
    b.classList.toggle("active",b.dataset.mode===$("mode").value);
  });
  const ms=$("maskSwatch");if(ms)ms.style.background=maskColor?"rgb("+maskColor.join(",")+")":"#333";
  const ws=$("wbSwatch");
  if(ws){
    if(wbGains){
      const c=[0,1,2].map(i=>Math.round(255/Math.max(.01,wbGains[i])));
      ws.style.background="rgb("+c.join(",")+")";
    }else ws.style.background="#333";
  }
  const ml=$("maskLabel");if(ml)ml.textContent=maskColor?"RGB("+maskColor.join(", ")+")":"не выбрано";
  const wl=$("wbLabel");if(wl)wl.textContent=wbGains?"установлено":"не настроено";
}

/* ---------- Slider HTML/bind ---------- */
function sliderHTML(id,label,extraClass){
  const cls = "slider" + (extraClass ? " "+extraClass : "");
  return `
  <div class="${cls}" data-slider-id="${id}">
    <div class="row">
      <label for="${id}_ui">${label}</label>
      <span class="val" id="${id}Val">${$(id).value}${id==="maskStrength"?"%":""}</span>
    </div>
    <div class="ctrl">
      <button class="icon-btn reset" type="button" data-reset-slider="${id}" title="Сброс" aria-label="Сброс">↺</button>
      <input id="${id}_ui" type="range" min="${$(id).min}" max="${$(id).max}" value="${$(id).value}">
      <button class="icon-btn lock" type="button" data-lock-slider="${id}" title="Заблокировать" aria-label="Заблокировать">🔓</button>
    </div>
  </div>`;
}
function bindSlider(id){
  const hidden=$(id),ui=$(`${id}_ui`);
  if(!ui)return;
  ui.value=hidden.value;
  ui.addEventListener("input",()=>{
    if(lockedSliders.has(id))return;
    hidden.value=ui.value;
    scheduleRender();
    const val=$(`${id}Val`);if(val)val.textContent=ui.value+(id==="maskStrength"?"%":"");
  });
  const resetBtn=document.querySelector(`[data-reset-slider="${id}"]`);
  if(resetBtn){
    resetBtn.onclick=()=>{
      hidden.value=defaults[id];
      ui.value=defaults[id];
      scheduleRender();
      const val=$(`${id}Val`);if(val)val.textContent=defaults[id]+(id==="maskStrength"?"%":"");
      toast("Сброшено");
    };
  }
  const lockBtn=document.querySelector(`[data-lock-slider="${id}"]`);
  if(lockBtn){
    if(lockedSliders.has(id)){
      ui.disabled=true;
      lockBtn.classList.add("locked");
      lockBtn.textContent="🔒";
    }
    lockBtn.onclick=()=>{
      if(lockedSliders.has(id)){
        lockedSliders.delete(id);
        ui.disabled=false;
        lockBtn.classList.remove("locked");
        lockBtn.textContent="🔓";
        toast("Ползунок разблокирован");
      }else{
        lockedSliders.add(id);
        ui.disabled=true;
        lockBtn.classList.add("locked");
        lockBtn.textContent="🔒";
        toast("Ползунок заблокирован");
      }
    };
  }
}

function renderToolPanel(){

  if(activeTool==="crop")renderCropPanel(body);
  else if(activeTool==="targets")renderTargetsPanel(body);
  else if(activeTool==="light")renderLightPanel(body);
  else if(activeTool==="color")renderColorPanel(body);
  else if(activeTool==="profiles")renderProfilesPanel(body);
  else if(activeTool==="save")renderSavePanel(body);
  refreshUIFromState();
}

      <span class="ratio-lbl">4:3</span>
    </button>
    <button class="ratio-cell ${currentRatio==="3:2"?"active":""}" data-ratio="3:2">
      <span class="ratio-icon" style="width:22px;height:15px"></span>
      <span class="ratio-lbl">3:2</span>
    </button>
    <button class="ratio-cell ${currentRatio==="16:9"?"active":""}" data-ratio="16:9">
      <span class="ratio-icon" style="width:24px;height:14px"></span>
      <span class="ratio-lbl">16:9</span>
    </button>
    <button class="ratio-cell primary" id="cropApplyBtn" data-ratio="apply">
      <span class="action-ico">✓</span>
      <span class="action-lbl">Готово</span>
    </button>
    <button class="ratio-cell ${currentRatio==="1:1"?"active":""}" data-ratio="1:1">
      <span class="ratio-icon" style="width:20px;height:20px"></span>
      <span class="ratio-lbl">1:1</span>
    </button>
    <button class="ratio-cell ${currentRatio==="3:4"?"active":""}" data-ratio="3:4">
      <span class="ratio-icon" style="width:16px;height:22px"></span>
      <span class="ratio-lbl">3:4</span>
    </button>
    <button class="ratio-cell ${currentRatio==="2:3"?"active":""}" data-ratio="2:3">
      <span class="ratio-icon" style="width:15px;height:22px"></span>
      <span class="ratio-lbl">2:3</span>
    </button>
    <button class="ratio-cell ${currentRatio==="9:16"?"active":""}" data-ratio="9:16">
      <span class="ratio-icon" style="width:14px;height:24px"></span>
      <span class="ratio-lbl">9:16</span>
    </button>
    <button class="ratio-cell action" id="geomResetBtn" data-ratio="reset">
      <span class="action-ico">↺</span>
      <span class="action-lbl">Сброс</span>
    </button>`;
  g.append(grid);
  body.append(g);

  $("rotL").onclick=()=>rotateImage(-1);
  $("rotR").onclick=()=>rotateImage(1);

  $("cropApplyBtn").onclick=()=>{
    if(!originalPixels||!cropRect||!cropEnabled){toast("Выбери пресет","err");return}
    const x=Math.max(0,Math.floor(cropRect.x));
    const y=Math.max(0,Math.floor(cropRect.y));
    const w=Math.min(originalPixels.width-x,Math.floor(cropRect.w));
    const h=Math.min(originalPixels.height-y,Math.floor(cropRect.h));
    if(w<2||h<2){toast("Слишком мало","err");return}
    const cropped=new ImageData(w,h);
    for(let row=0;row<h;row++){
      const from=((y+row)*originalPixels.width+x)*4;
      cropped.data.set(originalPixels.data.subarray(from,from+w*4),row*w*4);
    }
    showWorkingPixels(cropped);
    cropEnabled=false;currentRatio="free";
    document.querySelectorAll(".ratio-cell").forEach(b=>{
      const r=b.dataset.ratio;
      if(!r||r==="apply"||r==="reset")return;
      b.classList.toggle("active",r==="free");
    });
    setView("result");
    toast("Кадрирование применено","good");
  };
  $("geomResetBtn").onclick=()=>{
    if(!basePixels){toast("Нет фото","err");return}
    showWorkingPixels(basePixels);
    cropEnabled=false;cropRect=null;cropDrag=null;currentRatio="free";
    document.querySelectorAll(".ratio-cell").forEach(b=>{
      const r=b.dataset.ratio;
      if(!r||r==="apply"||r==="reset")return;
      b.classList.toggle("active",r==="free");
    });
    toast("Сброшено","good");
  };
  document.querySelectorAll(".ratio-cell").forEach(btn=>{
    const r=btn.dataset.ratio;
    if(r==="apply"||r==="reset")return;
    btn.onclick=()=>{
      if(r===currentRatio&&cropEnabled){
        cropEnabled=false;cropRect=null;cropDrag=null;
        drawMarkers();render();currentRatio="free";
        document.querySelectorAll(".ratio-cell").forEach(b=>{
          const rr=b.dataset.ratio;
          if(!rr||rr==="apply"||rr==="reset")return;
          b.classList.toggle("active",rr==="free");
        });
        return;
      }
      applyAspectRatio(r);
    };
  });
}

  });
}

/* --- ЦВЕТ: единый блок; R/G/B без подписей, с цветными треками --- */
function renderColorPanel(body){
  const g=document.createElement("div");g.className="group";
  g.style.padding="6px 10px 6px";

  // Насыщенность и Температура — обычные
  const topRow=document.createElement("div");
  topRow.innerHTML=
    sliderHTML("saturation","Насыщенность")+
    sliderHTML("temperature","Температура","sl-temp");
  g.append(topRow);

  // R / G / B — без подписи, только ползунок с цветным треком
  const rgbWrap=document.createElement("div");
  rgbWrap.innerHTML=`
    ${rgbSliderHTML("red","sl-red")}
    ${rgbSliderHTML("green","sl-green")}
    ${rgbSliderHTML("blue","sl-blue")}
  `;
  g.append(rgbWrap);

  body.append(g);

  bindSlider("saturation");
  bindSlider("temperature");
  bindSlider("red");bindSlider("green");bindSlider("blue");
}

/* R/G/B без подписи — только ползунок с цветным градиентом */
function rgbSliderHTML(id,extraClass){
  return `
  <div class="slider ${extraClass}" data-slider-id="${id}">
    <div class="ctrl">
      <button class="icon-btn reset" type="button" data-reset-slider="${id}" title="Сброс" aria-label="Сброс">↺</button>
      <input id="${id}_ui" type="range" min="${$(id).min}" max="${$(id).max}" value="${$(id).value}">
      <button class="icon-btn lock" type="button" data-lock-slider="${id}" title="Заблокировать" aria-label="Заблокировать">🔓</button>
    </div>
  </div>`;
}

function renderProfilesPanel(body){
  const g=document.createElement("div");g.className="group";
  g.innerHTML=`
    <input id="profileName" class="input" type="text" placeholder="Название профиля">
    <div class="btn-row tight">
      <button class="btn" id="saveProfileBtn">Сохранить</button>
    </div>
    <select id="profiles" class="input" style="margin-top:6px">
      <option value="">— Выбери профиль —</option>
    </select>
    <div class="btn-row tight">
      <button class="btn primary" id="loadProfileBtn">Применить</button>
      <button class="btn danger" id="deleteProfileBtn">Удалить</button>
    </div>
    <div class="btn-row tight" style="margin-top:8px">
      <button class="btn" id="exportProfileBtn">Экспорт</button>
      <label for="importProfileFile" class="file-btn">Импорт</label>
      <button class="btn" id="exportAllBtn">Все</button>
    </div>
    <input id="importProfileFile" type="file" accept=".json,application/json" style="display:none">`;
  body.append(g);

  refreshProfiles();

  $("saveProfileBtn").onclick=()=>{
    const typed=$("profileName").value.trim();
    if(!typed){alert("Введи название профиля");$("profileName").focus();return}
    const ps=getProfiles();
    if(Object.prototype.hasOwnProperty.call(ps,typed)&&!confirm('Перезаписать "'+typed+'"?'))return;
    ps[typed]=currentProfile();
    if(writeProfiles(ps)){refreshProfiles(typed);toast("Профиль сохранён","good")}
  };
  $("loadProfileBtn").onclick=()=>{
    const name=$("profiles").value,p=getProfiles()[name];
    if(!p){alert("Выбери профиль");return}
    if(!validProfile(p)){alert("Некорректный профиль");return}

    // Применяем к ТЕКУЩЕМУ фото и запоминаем как «шаблон» для новых
    appliedProfile = {
      settings:{...p.settings},
      mode:p.mode||"negative",
      maskColor:p.maskColor?[...p.maskColor]:null,
      wbGains:p.wbGains?[...p.wbGains]:null
    };

    setSliderValues(p.settings);
    $("mode").value=p.mode||"negative";
    maskColor=p.maskColor?[...p.maskColor]:null;
    wbGains=p.wbGains?[...p.wbGains]:null;
    maskPoint=null;wbPoint=null;
    syncAllSlidersUI();
    drawMarkers();render();refreshUIFromState();

    // Сохраняем в текущее фото
    saveCurrentPhotoSettings();

    toast('Профиль "'+name+'" применён','good');
  };
  $("deleteProfileBtn").onclick=()=>{
    const name=$("profiles").value;if(!name)return;
    if(!confirm('Удалить "'+name+'"?'))return;
    const ps=getProfiles();delete ps[name];
    if(writeProfiles(ps)){refreshProfiles();toast("Удалено")}
  };
  $("exportProfileBtn").onclick=()=>{
    const name=$("profiles").value;if(!name){alert("Выбери профиль");return}
    const p=getProfiles()[name];if(!p)return;
    downloadJSON({format:"FilmLabProfile",version:1,profiles:{[name]:p}},safeProfileFilename(name)+".json");
  };
  $("exportAllBtn").onclick=()=>{
    const p=getProfiles();if(!Object.keys(p).length){alert("Нет профилей");return}
    downloadJSON({format:"FilmLabBackup",version:1,profiles:p},"FilmLab_backup.json");
  };
  $("importProfileFile").onchange=async e=>{
    const file=e.target.files[0];e.target.value="";if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      let incoming;
      if(data&&data.profiles)incoming=data.profiles;
      else if(validProfile(data))incoming={[file.name.replace(/\.json$/i,"")]:data};
      else{alert("Не файл профиля");return}
      const ex=getProfiles();let added=0;
      for(const [n,p] of Object.entries(incoming)){
        if(!validProfile(p))continue;
        if(ex[n]&&!confirm('Перезаписать "'+n+'"?'))continue;
        ex[n]=p;added++;
      }
      if(added&&writeProfiles(ex)){refreshProfiles();toast("Импортировано: "+added,"good")}
    }catch(err){alert("Не удалось прочитать JSON")}
  };
}

function renderSavePanel(body){
  const gGal=document.createElement("div");gGal.className="group";
  gGal.innerHTML=`
    <div class="photo-name" id="photoName"></div>
    <div id="gallery"></div>
    <div id="galleryEmpty">Пока пусто — добавь скан.</div>
    <div class="btn-row tight">
      <label for="fileInput" class="file-btn">＋ Добавить</label>
      <label for="cameraInput" class="file-btn">📷 Снять</label>
      <button class="btn danger" id="delBtn">Удалить</button>
      <button class="btn" id="clearBtn">Очистить</button>
    </div>`;
  body.append(gGal);

  const gSave=document.createElement("div");gSave.className="group";
  gSave.innerHTML=`
    <div class="btn-row tight">
      <button class="btn primary" id="saveJpegBtn">💾 JPEG</button>
      <button class="btn" id="batchBtn">Все фото</button>
    </div>`;
  body.append(gSave);

  updateGallery();

  $("delBtn").onclick=()=>{if(selectedId!==null)removePhoto(selectedId)};
  $("clearBtn").onclick=()=>{
    if(!photos.length)return;
    if(!confirm("Удалить все фотографии?"))return;
    photos.forEach(p=>URL.revokeObjectURL(p.url));
    photos=[];selectedId=null;
    updateGallery();resetStage();
  };
  $("saveJpegBtn").onclick=saveCurrentJpeg;
  $("batchBtn").onclick=async()=>{
    if(!photos.length){toast("Нет фото","err");return}
    if(!confirm("Сохранить обработанные копии всех фото?"))return;
    // Сохранить настройки текущего фото перед пакетной
    saveCurrentPhotoSettings();
    const overlay=$("batchOverlay"),bt=$("batchText");
    overlay.classList.add("show");
    try{
      for(let n=0;n<photos.length;n++){
        const photo=photos[n];
        // Используем настройки ЭТОГО фото, если есть; иначе — шаблон
        const s = photo.settings || currentProfileSettingsTemplate();
        const opts = {...s.settings,mode:s.mode,mask:s.maskColor?[...s.maskColor]:null,wb:s.wbGains?[...s.wbGains]:null};
        bt.textContent="Обработка "+(n+1)+" из "+photos.length;
        await new Promise(resolve=>{
          const img=new Image();
          img.onload=()=>{
            try{
              const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
              const w=Math.max(1,Math.round(img.naturalWidth*scale));
              const h=Math.max(1,Math.round(img.naturalHeight*scale));
              const temp=document.createElement("canvas");
              temp.width=w;temp.height=h;
              const ctx=temp.getContext("2d",{willReadFrequently:true});
              ctx.drawImage(img,0,0,w,h);
              const pix=ctx.getImageData(0,0,w,h),d=pix.data;
              for(let i=0;i<d.length;i+=4){
                const p=transformPixel(d[i],d[i+1],d[i+2],opts);
                d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];
              }
              ctx.putImageData(pix,0,0);
              downloadCanvas(temp,safeFilename(photo.name)+"_positive.jpg");
            }catch(err){console.error(err)}
            resolve();
          };
          img.onerror=()=>resolve();
          img.src=photo.url;
        });
      }
    }finally{overlay.classList.remove("show")}
    toast("Пакетная обработка завершена","good");
  };
}

function switchTool(tool){
  if(pickerMode&&tool!=="targets")stopPicking();
  activeTool=tool;
  document.querySelectorAll("#bottomNav [data-tool]").forEach(b=>{
    b.classList.toggle("active",b.dataset.tool===tool);
  });
  renderToolPanel();
}
document.querySelectorAll("#bottomNav [data-tool]").forEach(b=>{
  b.addEventListener("click",()=>switchTool(b.dataset.tool));
});

/* ---------- Init ---------- */
setView("result");
updateSliderLabels();
refreshUIFromState();
switchTool("crop");
setTimeout(resizeAllStacks,50);

})();
